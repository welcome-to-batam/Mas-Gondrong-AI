<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Assistant Helper</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 10px;
    }
    #response {
      margin-top: 10px;
      white-space: pre-wrap;
      background-color: #f0f0f0;
      padding: 8px;
      border-radius: 4px;
      min-height: 60px;
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
    #textContent {
      margin-top: 10px;
      max-height: 100px;
      overflow-y: auto;
      background-color: #fafafa;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h3>AI Assistant Helper</h3>
  <button id="getTextBtn">Get Text from Page</button>
  <div id="textContent"></div>
  <button id="askAI" disabled>Ask AI for Reply</button>
  <div id="response"></div>

  <script src="popup.js"></script>
</body>
</html>
